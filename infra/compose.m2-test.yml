# Dedicated ephemeral M2 test cluster. Never point this at M1 volumes/databases.
name: trissea-m2-identity-test
services:
  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    command: ['redis-server','--save','','--appendonly','no','--maxmemory-policy','noeviction']
    ports:
      - '127.0.0.1:16380:6379'
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_USER: m2_test_owner
      POSTGRES_DB: m2_control
      POSTGRES_PASSWORD: ${M2_TEST_POSTGRES_PASSWORD:?Generate an ignored local test password}
      TZ: UTC
      PGTZ: UTC
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - '127.0.0.1:${M2_TEST_POSTGRES_PORT:-15433}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U m2_test_owner -d m2_control']
      interval: 2s
      timeout: 3s
      retries: 30
