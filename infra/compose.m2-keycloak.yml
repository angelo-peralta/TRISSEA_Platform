# Isolated LOCAL/SYNTHETIC identity provider. Never reuse operational DB roles/volumes.
name: trissea-m2-keycloak
services:
  postgres:
    image: postgis/postgis:17-3.5@sha256:01a6a70e41e6c4467c8f55f6063555ed72db2d6662cd0d571040d42eadaeb6f6
    environment:
      POSTGRES_DB: keycloak_identity
      POSTGRES_USER: keycloak_owner
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_OWNER_PASSWORD:?Run keycloak:prepare}
      TZ: UTC
    tmpfs: ['/var/lib/postgresql/data']
    volumes:
      - ../.cache/m2-keycloak/postgres-init.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U keycloak_owner -d keycloak_identity']
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    platform: linux/amd64
    image: quay.io/keycloak/keycloak:26.8.2@sha256:4340d05ee7d15be34293868d495ac772d61f1a4d0e43d53bae2e75e2f05de185
    command: ['start-dev','--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_identity
      KC_DB_USERNAME: keycloak_runtime
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run keycloak:prepare}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_USER:?Run keycloak:prepare}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_PASSWORD:?Run keycloak:prepare}
      KC_HOSTNAME: http://127.0.0.1:18080
      KC_HOSTNAME_STRICT: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ACCESS_LOG_ENABLED: 'false'
      KC_LOG_LEVEL: warn
    ports: ['127.0.0.1:18080:8080','127.0.0.1:19000:9000']
    depends_on:
      postgres: {condition: service_healthy}
    volumes:
      - ../.cache/m2-keycloak/realm-import:/opt/keycloak/data/import:ro
    healthcheck:
      test: ['CMD-SHELL',"bash -ec 'exec 3<>/dev/tcp/localhost/9000; printf \"GET /health/ready HTTP/1.0\\r\\n\\r\\n\" >&3; cat <&3 | grep -q UP'"]
      interval: 5s
      timeout: 4s
      retries: 40
