name: M1 foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-and-apps:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - name: Install pinned package manager
        run: npm install --global pnpm@11.20.0
      - name: Require reviewed lockfile
        run: node -e "require('node:fs').accessSync('pnpm-lock.yaml')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm mobile:check
      - run: pnpm mobile:doctor
      - run: pnpm mobile:export
      - run: pnpm audit:dependencies
      - run: python scripts/validate_tuguegarao_fares.py
  local-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm infra:up
      - run: pnpm db:up
      - name: Reapply is a no-op
        run: pnpm db:up
      - run: pnpm db:verify
      - run: pnpm db:down
      - run: pnpm db:verify:rollback
      - run: pnpm db:up
      - run: pnpm db:verify
      - if: always()
        run: docker compose --env-file .env -f infra/compose.yml down
