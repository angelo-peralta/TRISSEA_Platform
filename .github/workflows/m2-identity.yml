name: M2 identity foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  isolated-identity-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-identity-test.mjs
      - run: docker compose --env-file .env.m2-test -f infra/compose.m2-test.yml up -d --wait
      - run: pnpm test:identity:db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-identity-database-results
          path: evidence/m2/m2-1/database-results.json
      - if: always()
        run: docker compose --env-file .env.m2-test -f infra/compose.m2-test.yml stop
