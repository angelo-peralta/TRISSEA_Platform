name: M2 identity foundation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  isolated-identity-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
      - run: npm install --global pnpm@11.20.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-identity-test.mjs
      - run: docker compose --env-file .env.m2-test -f infra/compose.m2-test.yml up -d --wait
      - run: pnpm test:identity:db
      - run: pnpm test:authorization:db
      - run: pnpm test:passenger:auth
      - run: pnpm test:driver:auth
      - run: pnpm keycloak:prepare
      - run: pnpm keycloak:up
      - run: pnpm keycloak:provision
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:admin:auth
      - run: pnpm test:verification
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-synthetic-verification-results
          path: .cache/m2-verification/results.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-identity-database-results
          path: .cache/m2-identity/database-results.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-authorization-database-results
          path: .cache/m2-authorization/database-results.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-passenger-auth-results
          path: .cache/m2-passenger/results.json
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m2-driver-auth-results
          path: .cache/m2-driver/results.json
          include-hidden-files: true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m2-admin-keycloak-results
          path: |
            .cache/m2-admin/results.json
            .cache/m2-admin/screenshots/*.png
          include-hidden-files: true
      - if: always()
        run: if [ -f .env.local ]; then docker compose --env-file .env.local -f infra/compose.m2-keycloak.yml stop; fi
      - if: always()
        run: docker compose --env-file .env.m2-test -f infra/compose.m2-test.yml stop
