paths:
  /health:
    get:
      tags: [Ops]
      operationId: getHealth
      security: []
      summary: M1 public process liveness; not dependency readiness or booking eligibility
      x-implemented-in: M1
      responses:
        '200':
          description: Process is alive; bookings remain disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/phone/challenges:
    post:
      tags:
        - Identity
      operationId: requestPassengerOtp
      x-implemented-in: M2.3-local-synthetic
      summary: requestPassengerOtp
      description: "Explicit local-synthetic feature flag required. No live SMS or
        operational services. Cache-Control: no-store."
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneChallengeRequest"
      responses:
        "202":
          description: Success (local mock only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneChallengeResponse"
        "400":
          $ref: "#/components/responses/PhoneAuthFailure"
        "401":
          $ref: "#/components/responses/PhoneAuthFailure"
        "403":
          $ref: "#/components/responses/PhoneAuthFailure"
        "404":
