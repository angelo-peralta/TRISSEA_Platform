openapi: 3.1.0
info:
  title: TRISSEA Tuguegarao MVP API
  version: 0.9.0
  description: M1 health and M2.3-M2.6 local synthetic identity, Keycloak BFF and verification are implemented behind explicit flags. Real documents, live SMS, recovery and operations remain disabled.
servers:
- url: https://api.example.invalid/v1
  description: placeholder
security:
- bearerAuth: []
tags:
- name: Identity
- name: Services
- name: Quotes
- name: Rides
- name: Driver
- name: FareAdmin
- name: TODAAdmin
- name: Ops
components:
  securitySchemes:
    adminCookie:
      type: apiKey
      in: cookie
      name: trissea_admin_local
      description: Local-only HttpOnly host-only SameSite=Strict cookie. Production contract requires
        __Host-trissea-admin Secure; production activation is gated. No bearer/provider token accepted.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RideId:
      in: path
      name: rideId
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      in: path
      name: offerId
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 12
        maxLength: 128
  responses:
    PhoneAuthFailure:
      description: Sanitized failure; no codes, contacts or credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PhoneAuthError'
  schemas:
    VerificationOpenRequest:
      type: object
      additionalProperties: false
      required:
        - relationshipId
        - kind
      properties:
        relationshipId: &a1
          type: string
          format: uuid
        kind: &a3
          type: string
          enum:
            - DRIVER
            - VEHICLE
            - TODA_MEMBERSHIP
    VerificationSubmitRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - evidenceId
        - evidenceVersion
      properties:
        expectedVersion: &a2
          type: integer
          minimum: 1
          maximum: 2147483646
        evidenceId: *a1
        evidenceVersion: *a2
    VerificationDecisionRequest:
      type: object
      additionalProperties: false
      required:
        - expectedVersion
        - evidenceVersion
        - outcome
        - reasonCode
      properties:
        expectedVersion: *a2
        evidenceVersion: *a2
        outcome:
          type: string
          enum:
            - APPROVE
            - REJECT
            - REVOKE
            - EXPIRE
        reasonCode:
          type: string
          enum:
            - SYNTHETIC_ACCEPTED
            - SYNTHETIC_INCOMPLETE
            - SYNTHETIC_MISMATCH
            - SYNTHETIC_WITHDRAWN
            - SYNTHETIC_EXPIRED
      description: Reason must match outcome. Only APPROVE accepts current synthetic target/policy/evidence.
        Terminal decisions require an approved case; EXPIRE requires database time past validity. No caller
        capacity, validity, reviewer, permit or status fields.
    VerificationCase:
      type: object
      additionalProperties: false
      required:
        - id
        - cityTenantId
        - todaId
        - relationshipId
        - kind
        - state
        - effectiveState
        - evidenceCurrent
        - version
        - round
        - assigned
        - validUntil
        - source
        - realDocumentsEnabled
        - operationalServicesEnabled
        - realDriverApproved
      properties:
        id: *a1
        cityTenantId: *a1
        todaId: *a1
        relationshipId: *a1
        kind: *a3
        state: &a4
          type: string
          enum:
            - DRAFT
            - SUBMITTED
            - APPROVED
            - REJECTED
            - REVOKED
            - EXPIRED
        effectiveState:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, REJECTED, REVOKED, EXPIRED, STALE]
        evidenceCurrent:
          type: [boolean, "null"]
        version: *a2
        round:
          type: integer
          minimum: 0
        assigned: &a8
          type: boolean
        validUntil: &a9
          type:
            - string
            - "null"
          format: date-time
        source: &a6
          type: string
          const: SYNTHETIC_ONLY
        realDocumentsEnabled: &a5
          type: boolean
          const: false
        operationalServicesEnabled: *a5
        realDriverApproved: *a5
    VerificationCases:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - source
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/VerificationCase"
        nextCursor:
          type:
            - string
            - "null"
          format: uuid
        source: *a6
    VerificationEvidenceChoices:
      type: object
      additionalProperties: false
      required:
        - items
        - source
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - evidenceId
              - evidenceVersion
              - relationshipId
              - kind
              - referenceCode
              - validUntil
            properties:
              evidenceId: *a1
              evidenceVersion: *a2
              relationshipId: *a1
              kind: *a3
              referenceCode:
                type: string
                pattern: ^SYNTHETIC_[A-Z0-9_]{1,32}$
              validUntil: &a7
                type: string
                format: date-time
        source: *a6
    VerificationDetail:
      type: object
      additionalProperties: false
      required:
        - case
        - evidence
        - historyTruncated
        - submissions
        - decisions
      properties:
        case:
          $ref: "#/components/schemas/VerificationCase"
        evidence:
          type:
            - object
            - "null"
          additionalProperties: false
          required:
            - evidenceId
            - evidenceVersion
            - referenceCode
            - syntheticSeatCapacity
            - validUntil
          properties:
            evidenceId: *a1
            evidenceVersion: *a2
            referenceCode:
              type: string
              pattern: ^SYNTHETIC_[A-Z0-9_]{1,32}$
            syntheticSeatCapacity:
              type:
                - integer
                - "null"
              minimum: 1
            validUntil: *a7
        historyTruncated: *a8
        submissions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - round
              - evidenceId
              - evidenceVersion
              - submittedAt
            properties:
              round: *a2
              evidenceId: *a1
              evidenceVersion: *a2
              submittedAt: *a7
        decisions:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - round
              - outcome
              - reasonCode
              - evidenceVersion
              - decidedAt
              - validUntil
            properties:
              id: *a1
              round: *a2
              outcome:
                type: string
                enum:
                  - APPROVE
                  - REJECT
                  - REVOKE
                  - EXPIRE
              reasonCode:
                type: string
                enum:
                  - SYNTHETIC_ACCEPTED
                  - SYNTHETIC_INCOMPLETE
                  - SYNTHETIC_MISMATCH
                  - SYNTHETIC_WITHDRAWN
                  - SYNTHETIC_EXPIRED
              evidenceVersion: *a2
              decidedAt: *a7
              validUntil: *a9
    AdminLoginRequest:
      type: object
      additionalProperties: false
      required:
        - clientProof
      properties:
        clientProof:
          type: string
          pattern: ^[A-Za-z0-9_-]{43}$
          description: 256-bit CSPRNG browser attempt proof held in memory. Same key+proof permits a bounded
            retry; changed proof conflicts.
    AdminLoginResponse:
      type: object
      additionalProperties: false
      required:
        - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
          description: Approved Keycloak authorization URL with state and S256 PKCE, no provider token.
    AdminSession:
      type: object
      additionalProperties: false
      required:
        - userId
        - sessionId
        - clientPurpose
        - mfaVerified
        - csrfToken
        - permissionsResolvedPerResource
        - operationalServicesEnabled
      properties:
        userId: &a1
          type: string
          format: uuid
        sessionId: *a1
        clientPurpose:
          type: string
          const: ADMIN
        mfaVerified:
          type: boolean
          const: true
        csrfToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{64}$
        permissionsResolvedPerResource:
          type: boolean
          const: true
        operationalServicesEnabled:
          type: boolean
          const: false
    AdminScopeAccess:
      type: object
      additionalProperties: false
      required:
        - cityTenantId
        - todaId
        - canManageMemberships
        - operationalServicesEnabled
      properties:
        cityTenantId: &a2
          type: string
          format: uuid
        todaId: *a2
        canManageMemberships:
          type: boolean
          const: true
        operationalServicesEnabled:
          type: boolean
          const: false
    FutureObject: &id001
      type: object
    PhoneChallengeRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - clientPurpose
        - deviceId
        - clientProof
      properties:
        phone:
          type: string
          maxLength: 32
          description: Philippine mobile; normalized to E.164. Synthetic numbers only in
            this local slice.
        clientPurpose:
          type: string
          enum:
            - PASSENGER
            - DRIVER
        deviceId:
          type: string
          format: uuid
        clientProof:
          type: string
          pattern: ^[A-Za-z0-9_-]{43,86}$
          description: Secret generated with a CSPRNG and kept in secure client storage.
            Never log.
    PhoneChallengeResponse:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - expiresAt
        - resendAfter
        - clientPurpose
        - deliveryMode
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        resendAfter:
          type: string
          format: date-time
        clientPurpose:
          type: string
          enum:
            - PASSENGER
            - DRIVER
        deliveryMode:
          type: string
          const: MOCK
    PhoneChallengeStatus:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - expiresAt
        - resendAfter
        - clientPurpose
        - deliveryMode
        - state
      properties:
        challengeId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time
        resendAfter:
          type: string
          format: date-time
        clientPurpose:
          type: string
          enum:
            - PASSENGER
            - DRIVER
        deliveryMode:
          type: string
          const: MOCK
        state:
          type: string
          enum:
            - PENDING
            - EXPIRED
            - COMPLETED
    PhoneVerifyRequest:
      type: object
      additionalProperties: false
      required:
        - phone
        - clientPurpose
        - deviceId
        - clientProof
        - code
      properties:
        phone:
          type: string
          maxLength: 32
        clientPurpose:
          type: string
          enum:
            - PASSENGER
            - DRIVER
        deviceId:
          type: string
          format: uuid
        clientProof:
          type: string
          pattern: ^[A-Za-z0-9_-]{43,86}$
          description: Secret generated with a CSPRNG and kept in secure client storage.
            Never log.
        code:
          type: string
          pattern: ^[0-9]{6}$
    MobileRefreshRequest:
      type: object
      additionalProperties: false
      required:
        - clientPurpose
        - deviceId
        - clientProof
        - refreshToken
      properties:
        clientPurpose:
          type: string
          enum:
            - PASSENGER
            - DRIVER
        deviceId:
          type: string
          format: uuid
        clientProof:
          type: string
          pattern: ^[A-Za-z0-9_-]{43,86}$
          description: Secret generated with a CSPRNG and kept in secure client storage.
            Never log.
        refreshToken:
          type: string
          pattern: ^[A-Za-z0-9_-]{64}$
    MobileAuthResult:
      type: object
      additionalProperties: false
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - tokenType
        - userId
        - sessionId
        - clientPurpose
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        tokenType:
          type: string
          const: Bearer
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        clientPurpose:
          type: string
          enum:
            - PASSENGER
            - DRIVER
    PassengerProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - sessionId
        - clientPurpose
        - state
        - displayName
        - profileVersion
        - requiredNoticeVersion
        - requiredTermsVersion
        - operationsEnabled
        - environment
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        clientPurpose:
          type: string
          const: PASSENGER
        state:
          type: string
          enum:
            - CONSENT_REQUIRED
            - ACTIVE
        displayName:
          type:
            - string
            - "null"
        profileVersion:
          type: integer
          minimum: 1
        requiredNoticeVersion:
          type: string
        requiredTermsVersion:
          type: string
        operationsEnabled:
          type: boolean
          const: false
        environment:
          type: string
          const: LOCAL_SYNTHETIC
    PassengerProfileUpdate:
      type: object
      additionalProperties: false
      required:
        - displayName
        - expectedVersion
      properties:
        displayName:
          type:
            - string
            - "null"
          maxLength: 80
        expectedVersion:
          type: integer
          minimum: 1
    PassengerConsentRequest:
      type: object
      additionalProperties: false
      required:
        - noticeVersion
        - termsVersion
        - noticeAcknowledged
        - termsAccepted
      properties:
        noticeVersion:
          type: string
          const: local-synthetic-notice-v1
        termsVersion:
          type: string
          const: local-synthetic-terms-v1
        noticeAcknowledged:
          type: boolean
          const: true
        termsAccepted:
          type: boolean
          const: true
    PassengerSessionList:
      type: object
      additionalProperties: false
      required:
        - sessions
      properties:
        sessions:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - state
              - lastSeenAt
              - expiresAt
              - current
            properties:
              id:
                type: string
                format: uuid
              state:
                type: string
                enum:
                  - PREAUTH
                  - CONSENT_REQUIRED
                  - ACTIVE
                  - REVOKED
                  - EXPIRED
              lastSeenAt:
                type: string
                format: date-time
              expiresAt:
                type: string
                format: date-time
              current:
                type: boolean
    EmptyMutation:
      type: object
      additionalProperties: false
      required: []
      properties: {}
    PhoneAuthError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - INVALID_REQUEST
            - AUTH_FAILED
            - RATE_LIMITED
            - CONFLICT
            - UNAVAILABLE
        message:
          type: string
    DriverProfile:
      type: object
      additionalProperties: false
      required:
        - userId
        - sessionId
        - clientPurpose
        - state
        - driverStatus
        - profileVersion
        - requiredNoticeVersion
        - requiredTermsVersion
        - canGoOnline
        - operationalServicesEnabled
        - realDocumentsEnabled
        - environment
      properties:
        userId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        clientPurpose:
          type: string
          const: DRIVER
        state:
          type: string
          enum:
            - CONSENT_REQUIRED
            - ACTIVE
        driverStatus:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
            - SUSPENDED
            - REVOKED
            - EXPIRED
        profileVersion:
          type: integer
          minimum: 1
        requiredNoticeVersion:
          type: string
        requiredTermsVersion:
          type: string
        canGoOnline:
          type: boolean
          const: false
        operationalServicesEnabled:
          type: boolean
          const: false
        realDocumentsEnabled:
          type: boolean
          const: false
        environment:
          type: string
          const: LOCAL_SYNTHETIC
    DriverScopeOptions:
      type: object
      additionalProperties: false
      required:
        - scopes
        - environment
      properties:
        scopes:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - cityTenantId
              - todaId
              - cityName
              - todaName
            properties:
              cityTenantId:
                type: string
                format: uuid
              todaId:
                type: string
                format: uuid
              cityName:
                type: string
              todaName:
                type: string
        environment:
          type: string
          const: LOCAL_SYNTHETIC
    DriverSyntheticVehicles:
      type: object
      additionalProperties: false
      required:
        - vehicles
        - environment
      properties:
        vehicles:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required:
              - id
              - referenceCode
            properties:
              id:
                type: string
                format: uuid
              referenceCode:
                type: string
                pattern: ^SYNTHETIC_[A-Z0-9_]{1,32}$
        environment:
          type: string
          const: LOCAL_SYNTHETIC
    DriverAffiliationRequest:
      type: object
      additionalProperties: false
      required:
        - cityTenantId
        - todaId
      properties:
        cityTenantId:
          type: string
          format: uuid
        todaId:
          type: string
          format: uuid
    DriverAffiliation:
      type: object
      additionalProperties: false
      required:
        - id
        - cityTenantId
        - todaId
        - state
        - version
        - validUntil
      properties:
        id:
          type: string
          format: uuid
        cityTenantId:
          type: string
          format: uuid
        todaId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
            - SUSPENDED
            - REVOKED
            - EXPIRED
        version:
          type: integer
          minimum: 1
        validUntil:
          type:
            - string
            - "null"
          format: date-time
    DriverVehicleRequest:
      type: object
      additionalProperties: false
      required:
        - affiliationId
        - vehicleId
      properties:
        affiliationId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
    DriverVehicleRelationship:
      type: object
      additionalProperties: false
      required:
        - id
        - cityTenantId
        - todaId
        - state
        - version
        - validUntil
        - affiliationId
        - vehicleId
      properties:
        id:
          type: string
          format: uuid
        cityTenantId:
          type: string
          format: uuid
        todaId:
          type: string
          format: uuid
        state:
          type: string
          enum:
            - PENDING
            - VERIFIED
            - REJECTED
            - SUSPENDED
            - REVOKED
            - EXPIRED
        version:
          type: integer
          minimum: 1
        validUntil:
          type:
            - string
            - "null"
          format: date-time
        affiliationId:
          type: string
          format: uuid
        vehicleId:
          type: string
          format: uuid
    DriverVerificationStatus:
      type: object
      additionalProperties: false
      required:
        - affiliations
        - vehicleRelationships
        - realDocumentsEnabled
        - environment
      properties:
        affiliations:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DriverAffiliation"
        vehicleRelationships:
          type: array
          maxItems: 50
          items:
            $ref: "#/components/schemas/DriverVehicleRelationship"
        realDocumentsEnabled:
          type: boolean
          const: false
        environment:
          type: string
          const: LOCAL_SYNTHETIC
    DriverEligibility:
      type: object
      additionalProperties: false
      required:
        - cityTenantId
        - todaId
        - identityEligible
        - canGoOnline
        - operationalServicesEnabled
        - realDriverApproved
        - eligibilityBasis
        - reasons
      properties:
        cityTenantId:
          type: string
          format: uuid
        todaId:
          type: string
          format: uuid
        identityEligible:
          type: boolean
        canGoOnline:
          type: boolean
          const: false
        operationalServicesEnabled:
          type: boolean
          const: false
        realDriverApproved:
          type: boolean
          const: false
        eligibilityBasis:
          type: string
          const: SYNTHETIC_ONLY
        reasons:
          type: array
          items:
            type: string
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, milestone, bookingsEnabled]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: trissea-api
        milestone:
          type: string
          const: M1
        bookingsEnabled:
          type: boolean
          const: false
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        traceId:
          type: string
    Coords:
      type: object
      required:
      - longitude
      - latitude
      properties:
        longitude:
          type: number
          minimum: -180
          maximum: 180
        latitude:
          type: number
          minimum: -90
          maximum: 90
    QuoteRequest:
      type: object
      required:
      - rideOption
      - pickup
      - dropoff
      properties:
        rideOption:
          type: string
          enum:
          - REGULAR
          - SHARED
          - SPECIAL
        pickup:
          $ref: '#/components/schemas/Coords'
        dropoff:
          $ref: '#/components/schemas/Coords'
        seatsRequested:
          type: integer
          minimum: 1
        fareCategory:
          type: string
          enum:
          - REGULAR
          - STUDENT_SENIOR_PWD
        stops:
          type: array
          items:
            $ref: '#/components/schemas/Coords'
    Quote:
      type: object
      required:
      - id
      - rideOption
      - totalCentavos
      - currency
      - expiresAt
      - legalFareSourceId
      - policyVersion
      properties:
        id:
          type: string
          format: uuid
        rideOption:
          type: string
        totalCentavos:
          type: integer
          minimum: 0
        currency:
          type: string
          const: PHP
        expiresAt:
          type: string
          format: date-time
        legalFareSourceId:
          type: string
          format: uuid
        policyVersion:
          type: integer
        breakdown:
          type: object
    Ride:
      type: object
      required:
      - id
      - status
      - version
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        version:
          type: integer
        fareSnapshot:
          type: object
        driver:
          type:
          - object
          - 'null'
    FareDraft:
      type: object
      required:
      - sourceId
      - serviceCode
      - rules
      - reason
      properties:
        sourceId:
          type: string
          format: uuid
        serviceCode:
          type: string
          enum:
          - REGULAR
          - SHARED
          - SPECIAL
          - RESERVATION
        reason:
          type: string
          minLength: 12
        rules:
          type: array
          items:
            type: object
paths:
  /health:
    get:
      tags: [Ops]
      operationId: getHealth
      security: []
      summary: M1 public process liveness; not dependency readiness or booking eligibility
      x-implemented-in: M1
      responses:
        '200':
          description: Process is alive; bookings remain disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /auth/phone/challenges:
    post:
      tags:
        - Identity
      operationId: requestPassengerOtp
      x-implemented-in: M2.3-local-synthetic
      summary: requestPassengerOtp
      description: "Explicit local-synthetic feature flag required. No live SMS or
        operational services. Cache-Control: no-store."
      security: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneChallengeRequest"
      responses:
        "202":
